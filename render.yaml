# render.yaml
# Free backend hosting on Render.com
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: cryptoos-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: EXCHANGE_API_KEY
        sync: false
      - key: EXCHANGE_API_SECRET
        sync: false
      - key: EXCHANGE
        value: binance
      - key: CAPITAL_USDT
        value: "7.69"
      - key: DAILY_LOSS_LIMIT_PCT
        value: "5"
      - key: TRADE_SIZE_PCT
        value: "100"
      - key: MAX_DAILY_TRADES
        value: "20"
      - key: STOP_LOSS_PCT
        value: "2"
      - key: TAKE_PROFIT_PCT
        value: "3"
      - key: DEFAULT_SYMBOL
        value: "BTC/USDT"
      - key: PAPER_MODE
        value: "true"
      - key: DB_PATH
        value: "/opt/render/project/src/cryptoos.db"