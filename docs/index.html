<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CryptoOS — Trading Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050810; --surface: #0a0f1e; --surface2: #0f1628;
    --border: #1a2540; --border2: #243050;
    --accent: #00e5ff; --accent2: #7c3aed; --accent3: #10b981;
    --red: #ef4444; --yellow: #f59e0b; --text: #e2e8f0; --muted: #64748b;
    --font-mono: 'Space Mono', monospace; --font-display: 'Syne', sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:var(--font-mono); min-height:100vh; overflow-x:hidden; }
  body::before { content:''; position:fixed; inset:0; background-image:linear-gradient(rgba(0,229,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,0.03) 1px,transparent 1px); background-size:40px 40px; pointer-events:none; z-index:0; }
  #root { position:relative; z-index:1; }
  .header { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; border-bottom:1px solid var(--border); background:rgba(10,15,30,0.95); backdrop-filter:blur(20px); position:sticky; top:0; z-index:100; }
  .logo { font-family:var(--font-display); font-weight:800; font-size:22px; letter-spacing:-0.5px; }
  .logo span { color:var(--accent); }
  .header-status { display:flex; align-items:center; gap:16px; font-size:11px; color:var(--muted); }
  .live-dot { width:7px; height:7px; border-radius:50%; animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(16,185,129,0.4)} 50%{opacity:0.7;box-shadow:0 0 0 6px rgba(16,185,129,0)} }
  .paper-badge { background:rgba(245,158,11,0.15); border:1px solid rgba(245,158,11,0.3); color:var(--yellow); padding:3px 10px; border-radius:4px; font-size:10px; font-weight:700; letter-spacing:1px; }
  .main { max-width:1400px; margin:0 auto; padding:24px; display:grid; gap:16px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px; position:relative; overflow:hidden; }
  .card::before { content:''; position:absolute; top:0; left:0; right:0; height:1px; background:linear-gradient(90deg,transparent,rgba(0,229,255,0.3),transparent); }
  .card-title { font-family:var(--font-display); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:2px; color:var(--muted); margin-bottom:16px; }
  .stats-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .stat-card { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:16px; }
  .stat-label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
  .stat-value { font-family:var(--font-display); font-size:24px; font-weight:800; line-height:1; }
  .stat-sub { font-size:10px; color:var(--muted); margin-top:4px; }
  .green{color:var(--accent3)} .red{color:var(--red)} .cyan{color:var(--accent)} .yellow{color:var(--yellow)}
  .module-grid { display:grid; gap:12px; }
  .module-row { display:flex; align-items:center; justify-content:space-between; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:14px 16px; transition:border-color 0.2s; }
  .module-row.active { border-color:rgba(0,229,255,0.3); background:rgba(0,229,255,0.04); }
  .module-row.danger.active { border-color:rgba(239,68,68,0.3); background:rgba(239,68,68,0.04); }
  .module-name { font-family:var(--font-display); font-weight:600; font-size:14px; }
  .module-desc { font-size:10px; color:var(--muted); margin-top:2px; }
  .toggle-wrap { display:flex; align-items:center; gap:10px; }
  .toggle { position:relative; width:44px; height:24px; cursor:pointer; }
  .toggle input { opacity:0; width:0; height:0; }
  .toggle-track { position:absolute; inset:0; background:var(--border2); border-radius:24px; transition:0.3s; }
  .toggle-thumb { position:absolute; left:3px; top:3px; width:18px; height:18px; background:var(--muted); border-radius:50%; transition:0.3s; }
  .toggle.on .toggle-track { background:var(--accent3); }
  .toggle.on .toggle-thumb { transform:translateX(20px); background:white; }
  .toggle.danger.on .toggle-track { background:var(--red); }
  .toggle-label { font-size:11px; color:var(--muted); min-width:24px; }
  .toggle.on .toggle-label { color:var(--accent3); }
  .prices-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .price-item { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:12px; display:flex; justify-content:space-between; align-items:center; }
  .price-sym { font-size:12px; font-weight:700; color:var(--muted); }
  .price-val { font-family:var(--font-display); font-size:15px; font-weight:700; }
  .price-change-up { color:var(--accent3); font-size:10px; margin-top:2px; }
  .price-change-down { color:var(--red); font-size:10px; margin-top:2px; }
  .trades-list { display:flex; flex-direction:column; gap:8px; }
  .trade-card { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:14px; }
  .trade-card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .trade-badge-buy { background:rgba(16,185,129,0.15); color:var(--accent3); border:1px solid rgba(16,185,129,0.3); padding:3px 10px; border-radius:4px; font-size:10px; font-weight:700; letter-spacing:1px; }
  .trade-badge-sell { background:rgba(239,68,68,0.15); color:var(--red); border:1px solid rgba(239,68,68,0.3); padding:3px 10px; border-radius:4px; font-size:10px; font-weight:700; letter-spacing:1px; }
  .trade-badge-long { background:rgba(0,229,255,0.15); color:var(--accent); border:1px solid rgba(0,229,255,0.3); padding:3px 10px; border-radius:4px; font-size:10px; font-weight:700; letter-spacing:1px; }
  .trade-badge-short { background:rgba(124,58,237,0.15); color:#a78bfa; border:1px solid rgba(124,58,237,0.3); padding:3px 10px; border-radius:4px; font-size:10px; font-weight:700; letter-spacing:1px; }
  .trade-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .trade-field { display:flex; flex-direction:column; gap:2px; }
  .trade-field-label { font-size:9px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .trade-field-value { font-size:12px; font-weight:700; }
  .pnl-pos { color:var(--accent3); }
  .pnl-neg { color:var(--red); }
  .pnl-zero { color:var(--muted); }
  .status-open { color:var(--yellow); font-size:10px; font-weight:700; }
  .status-closed { color:var(--muted); font-size:10px; }
  .log-list { display:flex; flex-direction:column; gap:4px; max-height:300px; overflow-y:auto; }
  .log-row { font-size:11px; padding:6px 10px; border-radius:5px; border-left:2px solid transparent; background:var(--surface2); display:grid; grid-template-columns:auto 1fr; gap:10px; align-items:start; }
  .log-row.info { border-left-color:var(--accent); }
  .log-row.warn { border-left-color:var(--yellow); }
  .log-row.error { border-left-color:var(--red); background:rgba(239,68,68,0.05); }
  .log-time { color:var(--muted); white-space:nowrap; font-size:10px; }
  .risk-bar-wrap { margin-top:10px; }
  .risk-bar-label { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-bottom:6px; }
  .risk-bar-track { height:6px; background:var(--border2); border-radius:6px; overflow:hidden; }
  .risk-bar-fill { height:100%; border-radius:6px; transition:width 0.5s; }
  .btn { padding:10px 20px; border-radius:8px; border:none; cursor:pointer; font-family:var(--font-mono); font-size:12px; font-weight:700; letter-spacing:0.5px; transition:all 0.2s; }
  .btn-primary { background:var(--accent); color:var(--bg); }
  .btn-primary:hover { filter:brightness(1.1); }
  .btn-danger { background:rgba(239,68,68,0.15); color:var(--red); border:1px solid rgba(239,68,68,0.3); }
  .btn-ghost { background:var(--surface2); color:var(--text); border:1px solid var(--border2); }
  .btn-ghost:hover { border-color:var(--accent); color:var(--accent); }
  .settings-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .input-wrap { display:flex; flex-direction:column; gap:6px; }
  .input-label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
  .input-field { background:var(--surface2); border:1px solid var(--border2); border-radius:8px; padding:10px 12px; color:var(--text); font-family:var(--font-mono); font-size:13px; outline:none; transition:border-color 0.2s; width:100%; }
  .input-field:focus { border-color:var(--accent); }
  .tabs { display:flex; gap:4px; margin-bottom:16px; flex-wrap:wrap; }
  .tab { padding:7px 14px; border-radius:6px; font-size:11px; font-weight:700; letter-spacing:0.5px; cursor:pointer; background:transparent; border:1px solid transparent; color:var(--muted); font-family:var(--font-mono); transition:all 0.2s; }
  .tab.active { background:rgba(0,229,255,0.1); border-color:rgba(0,229,255,0.3); color:var(--accent); }
  .alert-warn { padding:10px 14px; border-radius:8px; background:rgba(245,158,11,0.1); border:1px solid rgba(245,158,11,0.3); color:var(--yellow); font-size:12px; line-height:1.6; margin-bottom:12px; }
  .empty { color:var(--muted); font-size:12px; text-align:center; padding:30px; }
  ::-webkit-scrollbar { width:4px; }
  ::-webkit-scrollbar-track { background:var(--surface); }
  ::-webkit-scrollbar-thumb { background:var(--border2); border-radius:4px; }
  .waking-banner { background:rgba(245,158,11,0.1); border:1px solid rgba(245,158,11,0.3); border-radius:8px; padding:10px 14px; margin-bottom:12px; font-size:12px; color:var(--yellow); display:flex; align-items:center; gap:8px; }
  .spinning { display:inline-block; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const API_BASE = 'https://cryptoos.onrender.com';
const WS_URL   = 'wss://cryptoos.onrender.com/ws';

// ── API helper ────────────────────────────────────────────────
async function api(path, method = 'GET', body = null) {
  try {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    const r = await fetch(API_BASE + path, opts);
    return await r.json();
  } catch (e) {
    return { error: e.message };
  }
}

// ── Toggle ────────────────────────────────────────────────────
function Toggle({ on, onToggle, danger }) {
  return (
    <div className={`toggle ${on?'on':''} ${danger?'danger':''}`} onClick={onToggle}>
      <div className="toggle-track"/>
      <div className="toggle-thumb"/>
    </div>
  );
}

// ── Trade Card — detailed view ────────────────────────────────
function TradeCard({ t }) {
  const pnl = t.pnl || 0;
  const pnlClass = pnl > 0 ? 'pnl-pos' : pnl < 0 ? 'pnl-neg' : 'pnl-zero';
  const pnlPrefix = pnl > 0 ? '+' : '';
  const side = (t.side || '').toLowerCase();
  const badgeClass =
    side === 'buy'   ? 'trade-badge-buy'   :
    side === 'sell'  ? 'trade-badge-sell'  :
    side === 'long'  ? 'trade-badge-long'  :
    side === 'short' ? 'trade-badge-short' : 'trade-badge-buy';

  const entryTime = t.created_at ? t.created_at.slice(0,16).replace('T',' ') : '—';
  const exitTime  = t.closed_at  ? t.closed_at.slice(0,16).replace('T',' ')  : null;

  // Duration
  let duration = '—';
  if (t.created_at && t.closed_at) {
    const secs = Math.floor((new Date(t.closed_at) - new Date(t.created_at)) / 1000);
    if (secs < 60) duration = `${secs}s`;
    else if (secs < 3600) duration = `${Math.floor(secs/60)}m ${secs%60}s`;
    else duration = `${Math.floor(secs/3600)}h ${Math.floor((secs%3600)/60)}m`;
  }

  // Return %
  const returnPct = t.price > 0
    ? ((pnl / (t.price * t.amount)) * 100).toFixed(2)
    : '0.00';

  const strategyLabel = {
    'ma_crossover': 'MA Crossover',
    'rsi_ma':       'RSI + MA',
    'manual':       'Manual',
  }[t.strategy] || t.strategy || 'MA Crossover';

  return (
    <div className="trade-card">
      <div className="trade-card-header">
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <span className={badgeClass}>{side.toUpperCase()}</span>
          <span style={{fontFamily:'var(--font-display)',fontWeight:700,fontSize:14}}>{t.symbol}</span>
          {t.leverage > 1 && <span style={{fontSize:10,color:'var(--red)',border:'1px solid rgba(239,68,68,0.3)',padding:'1px 6px',borderRadius:4}}>{t.leverage}×</span>}
          {t.paper ? <span style={{fontSize:9,color:'var(--muted)',border:'1px solid var(--border)',padding:'1px 6px',borderRadius:4}}>PAPER</span>
                   : <span style={{fontSize:9,color:'var(--accent3)',border:'1px solid rgba(16,185,129,0.3)',padding:'1px 6px',borderRadius:4}}>LIVE</span>}
        </div>
        <span className={t.status==='open' ? 'status-open' : 'status-closed'}>
          {t.status === 'open' ? '● OPEN' : '✓ CLOSED'}
        </span>
      </div>

      <div className="trade-grid">
        <div className="trade-field">
          <span className="trade-field-label">Entry Price</span>
          <span className="trade-field-value cyan">${Number(t.price).toLocaleString()}</span>
        </div>
        <div className="trade-field">
          <span className="trade-field-label">Exit Price</span>
          <span className="trade-field-value">{t.exit_price ? `$${Number(t.exit_price).toLocaleString()}` : '—'}</span>
        </div>
        <div className="trade-field">
          <span className="trade-field-label">Amount</span>
          <span className="trade-field-value">{Number(t.amount).toFixed(6)}</span>
        </div>
        <div className="trade-field">
          <span className="trade-field-label">Value (USDT)</span>
          <span className="trade-field-value">${(t.price * t.amount).toFixed(4)}</span>
        </div>
        <div className="trade-field">
          <span className="trade-field-label">PnL</span>
          <span className={`trade-field-value ${pnlClass}`}>{pnlPrefix}${pnl.toFixed(6)}</span>
        </div>
        <div className="trade-field">
          <span className="trade-field-label">Return</span>
          <span className={`trade-field-value ${pnlClass}`}>{pnl > 0 ? '+' : ''}{returnPct}%</span>
        </div>
        <div className="trade-field">
          <span className="trade-field-label">Strategy</span>
          <span className="trade-field-value" style={{fontSize:11}}>{strategyLabel}</span>
        </div>
        <div className="trade-field">
          <span className="trade-field-label">Duration</span>
          <span className="trade-field-value" style={{fontSize:11}}>{duration}</span>
        </div>
        <div className="trade-field">
          <span className="trade-field-label">Opened</span>
          <span className="trade-field-value" style={{fontSize:10,color:'var(--muted)'}}>{entryTime}</span>
        </div>
        <div className="trade-field">
          <span className="trade-field-label">Closed</span>
          <span className="trade-field-value" style={{fontSize:10,color:'var(--muted)'}}>{exitTime || '—'}</span>
        </div>
        {t.stop_loss && (
          <div className="trade-field">
            <span className="trade-field-label">Stop Loss</span>
            <span className="trade-field-value red">${Number(t.stop_loss).toLocaleString()}</span>
          </div>
        )}
        {t.take_profit && (
          <div className="trade-field">
            <span className="trade-field-label">Take Profit</span>
            <span className="trade-field-value green">${Number(t.take_profit).toLocaleString()}</span>
          </div>
        )}
      </div>
    </div>
  );
}

// ── Price Item with change indicator ─────────────────────────
function PriceItem({ sym, price, prevPrice }) {
  const changed = prevPrice && price !== prevPrice;
  const up = price > prevPrice;
  const changeClass = changed ? (up ? 'price-change-up' : 'price-change-down') : '';
  const arrow = changed ? (up ? '▲' : '▼') : '';
  const pct = prevPrice && prevPrice > 0
    ? ((price - prevPrice) / prevPrice * 100).toFixed(3)
    : null;

  return (
    <div className="price-item" style={{flexDirection:'column',alignItems:'flex-start',gap:4}}>
      <div style={{display:'flex',justifyContent:'space-between',width:'100%',alignItems:'center'}}>
        <span className="price-sym">{sym.replace('-USDT','')}</span>
        <span className="price-val cyan">${Number(price).toLocaleString()}</span>
      </div>
      {pct && (
        <span className={changeClass} style={{fontSize:10,alignSelf:'flex-end'}}>
          {arrow} {pct}% since last update
        </span>
      )}
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────
function App() {
  const [tab, setTab]               = React.useState('dashboard');
  const [liveData, setLiveData]     = React.useState(null);
  const [prevPrices, setPrevPrices] = React.useState({});
  const [botState, setBotState]     = React.useState({ spot:false, futures:false, staking:false, paper_mode:true });
  const [trades, setTrades]         = React.useState([]);
  const [logs, setLogs]             = React.useState([]);
  const [wsStatus, setWsStatus]     = React.useState('connecting');
  const [backendStatus, setBackendStatus] = React.useState('waking'); // waking | online | offline
  const [capital, setCapital]       = React.useState('');
  const [saved, setSaved]           = React.useState(false);
  const [pnlHistory, setPnlHistory] = React.useState([]);
  const wsRef = React.useRef(null);
  const retryRef = React.useRef(null);

  // ── Load capital from localStorage so it persists across refreshes
  React.useEffect(() => {
    const saved = localStorage.getItem('cryptoos_capital');
    if (saved) setCapital(saved);
    else setCapital('7.69');
  }, []);

  // ── Backend health check with patience for cold start ────────
  React.useEffect(() => {
    let attempts = 0;
    const maxAttempts = 10; // wait up to ~50 seconds for cold start

    async function checkHealth() {
      const r = await api('/health');
      if (r.status === 'ok') {
        setBackendStatus('online');
      } else {
        attempts++;
        if (attempts < maxAttempts) {
          setTimeout(checkHealth, 6000); // retry every 6 seconds
        } else {
          setBackendStatus('offline');
        }
      }
    }
    checkHealth();
  }, []);

  // ── WebSocket ─────────────────────────────────────────────────
  React.useEffect(() => {
    function connect() {
      try {
        const ws = new WebSocket(WS_URL);
        wsRef.current = ws;
        ws.onopen = () => {
          setWsStatus('live');
          setBackendStatus('online');
        };
        ws.onmessage = (e) => {
          const d = JSON.parse(e.data);
          setLiveData(prev => {
            if (prev && prev.prices) setPrevPrices(prev.prices);
            return d;
          });
          if (d.bot_state) setBotState(d.bot_state);
        };
        ws.onclose = () => {
          setWsStatus('reconnecting');
          retryRef.current = setTimeout(connect, 5000);
        };
        ws.onerror = () => setWsStatus('error');
      } catch(e) {
        setWsStatus('error');
      }
    }
    connect();
    return () => {
      clearTimeout(retryRef.current);
      wsRef.current?.close();
    };
  }, []);

  // ── Poll trades and logs every 8 seconds ─────────────────────
  React.useEffect(() => {
    async function fetchAll() {
      const t = await api('/trades?limit=30');
      if (t.trades) {
        setTrades(t.trades);
        const closed = t.trades.filter(x => x.status === 'closed');
        let running = parseFloat(capital) || 7.69;
        const hist = closed.map(x => { running += (x.pnl||0); return running; });
        if (hist.length) setPnlHistory(hist);
      }
      const l = await api('/logs?limit=50');
      if (l.logs) setLogs(l.logs);
    }
    if (backendStatus === 'online') {
      fetchAll();
      const iv = setInterval(fetchAll, 8000);
      return () => clearInterval(iv);
    }
  }, [backendStatus]);

  // ── Toggle module ─────────────────────────────────────────────
  async function toggleModule(module) {
    const current = botState[module];
    const action  = current ? 'stop' : 'start';
    setBotState(prev => ({...prev, [module]: !current}));
    const res = await api(`/bot/${module}/${action}`, 'POST');
    if (res.error) {
      setBotState(prev => ({...prev, [module]: current}));
      alert(`Error: ${res.error}`);
    }
  }

  // ── Save capital — persists to localStorage ───────────────────
  async function saveCapital() {
    const amt = parseFloat(capital);
    if (!amt || amt <= 0) return;
    localStorage.setItem('cryptoos_capital', String(amt));
    await api('/settings/capital', 'POST', { amount: amt });
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  }

  const d      = liveData || {};
  const prices = d.prices  || {};
  const stats  = d.stats   || {};
  const risk   = d.risk    || {};
  const totalPnl   = stats.total_pnl || 0;
  const cap        = parseFloat(capital) || 7.69;
  const lossUsed   = risk.daily_loss_limit_usd > 0
    ? Math.min((risk.daily_loss_usd / risk.daily_loss_limit_usd)*100, 100) : 0;

  const wsColor = wsStatus==='live' ? '#10b981' : wsStatus==='error' ? '#ef4444' : '#f59e0b';

  return (
    <div>
      {/* Header */}
      <div className="header">
        <div className="logo">Crypto<span>OS</span></div>
        <div className="header-status">
          <div style={{display:'flex',alignItems:'center',gap:6}}>
            <div className="live-dot" style={{background:wsColor}}/>
            <span>{wsStatus==='live'?'LIVE':wsStatus==='error'?'OFFLINE':'CONNECTING'}</span>
          </div>
          {botState.paper_mode !== false && <span className="paper-badge">PAPER MODE</span>}
        </div>
      </div>

      <div className="main">
        {/* Tabs */}
        <div className="tabs">
          {['dashboard','control','trades','logs','settings'].map(t => (
            <button key={t} className={`tab ${tab===t?'active':''}`} onClick={() => setTab(t)}>
              {t.toUpperCase()}
            </button>
          ))}
        </div>

        {/* Waking up banner — replaces the annoying popup */}
        {backendStatus === 'waking' && (
          <div className="waking-banner">
            <span className="spinning">⟳</span>
            Connecting to backend — Render free tier may take up to 50 seconds to wake up. Please wait...
          </div>
        )}
        {backendStatus === 'offline' && (
          <div className="alert-warn">
            ⚠️ Backend appears offline. Check <strong>cryptoos.onrender.com/health</strong> — if it returns ok, refresh this page.
          </div>
        )}

        {/* DASHBOARD */}
        {tab==='dashboard' && (
          <>
            <div className="stats-grid">
              <div className="stat-card">
                <div className="stat-label">Capital</div>
                <div className="stat-value cyan">${cap.toFixed(2)}</div>
                <div className="stat-sub">≈ KES {(cap*130).toFixed(0)}</div>
              </div>
              <div className="stat-card">
                <div className="stat-label">Total PnL</div>
                <div className={`stat-value ${totalPnl>=0?'green':'red'}`}>
                  {totalPnl>=0?'+':''}${totalPnl.toFixed(6)}
                </div>
                <div className="stat-sub">{stats.total_trades||0} total trades</div>
              </div>
              <div className="stat-card">
                <div className="stat-label">Win Rate</div>
                <div className="stat-value green">{stats.win_rate||0}%</div>
                <div className="stat-sub">{stats.wins||0}W / {stats.losses||0}L</div>
              </div>
              <div className="stat-card">
                <div className="stat-label">Open Trades</div>
                <div className="stat-value cyan">{stats.open_trades||0}</div>
                <div className="stat-sub">Active positions</div>
              </div>
            </div>

            <div className="card">
              <div className="card-title">⚡ Live Prices — updates every 3 seconds</div>
              <div className="prices-grid">
                {Object.keys(prices).length === 0 ? (
                  <div className="empty" style={{gridColumn:'span 2'}}>
                    {backendStatus==='waking' ? 'Waiting for backend...' : 'No price data'}
                  </div>
                ) : Object.entries(prices).map(([sym, price]) => (
                  <PriceItem key={sym} sym={sym} price={price} prevPrice={prevPrices[sym]}/>
                ))}
              </div>
            </div>

            <div className="card">
              <div className="card-title">🛡️ Risk Overview</div>
              <div className="stats-grid" style={{marginBottom:12}}>
                <div className="stat-card">
                  <div className="stat-label">Daily Loss</div>
                  <div className={`stat-value ${risk.safe_to_trade?'green':'red'}`}>
                    ${(risk.daily_loss_usd||0).toFixed(4)}
                  </div>
                  <div className="stat-sub">Limit: ${(risk.daily_loss_limit_usd||0).toFixed(4)}</div>
                </div>
                <div className="stat-card">
                  <div className="stat-label">Trades Today</div>
                  <div className="stat-value cyan">{risk.daily_trades||0}</div>
                  <div className="stat-sub">Max: {risk.max_daily_trades||20}</div>
                </div>
              </div>
              <div className="risk-bar-wrap">
                <div className="risk-bar-label">
                  <span>Daily Loss Used</span><span>{lossUsed.toFixed(1)}%</span>
                </div>
                <div className="risk-bar-track">
                  <div className="risk-bar-fill" style={{
                    width:`${lossUsed}%`,
                    background:lossUsed>75?'#ef4444':lossUsed>40?'#f59e0b':'#10b981'
                  }}/>
                </div>
              </div>
            </div>
          </>
        )}

        {/* CONTROL */}
        {tab==='control' && (
          <>
            <div className="alert-warn">
              ⚠️ Paper Mode is ON. All trades are simulated — no real orders placed.
            </div>
            <div className="card">
              <div className="card-title">🎛️ Module Control</div>
              <div className="module-grid">
                {[
                  { key:'spot',    label:'Spot Trading',    desc:'MA crossover strategy • BTC/USDT • checks every 10 seconds', danger:false },
                  { key:'futures', label:'Futures Trading', desc:'⚠️ RSI + MA strategy • Long/Short • max 3× leverage',       danger:true  },
                  { key:'staking', label:'Staking Tracker', desc:'Track APR rewards — does not auto-stake',                    danger:false },
                ].map(m => (
                  <div key={m.key} className={`module-row ${m.danger?'danger':''} ${botState[m.key]?'active':''}`}>
                    <div>
                      <div className="module-name">{m.label}</div>
                      <div className="module-desc">{m.desc}</div>
                    </div>
                    <div className="toggle-wrap">
                      <span className={`toggle-label ${botState[m.key]?(m.danger?'red':'green'):''}`}>
                        {botState[m.key]?'ON':'OFF'}
                      </span>
                      <Toggle on={botState[m.key]} onToggle={()=>toggleModule(m.key)} danger={m.danger}/>
                    </div>
                  </div>
                ))}
              </div>
            </div>
            <div className="card">
              <div className="card-title">⚡ Quick Actions</div>
              <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
                <button className="btn btn-danger" onClick={async()=>{
                  await api('/bot/stop-all','POST');
                  setBotState(p=>({...p,spot:false,futures:false,staking:false}));
                }}>🛑 STOP ALL BOTS</button>
                <button className="btn btn-ghost" onClick={()=>setTab('logs')}>📋 View Logs</button>
                <button className="btn btn-ghost" onClick={()=>setTab('settings')}>⚙️ Settings</button>
              </div>
            </div>
          </>
        )}

        {/* TRADES — detailed */}
        {tab==='trades' && (
          <div className="card">
            <div className="card-title">
              📈 Trade History — {trades.length} trades
              {trades.filter(t=>t.status==='open').length > 0 &&
                <span style={{marginLeft:8,color:'var(--yellow)',fontWeight:700}}>
                  ({trades.filter(t=>t.status==='open').length} open)
                </span>
              }
            </div>
            {trades.length===0 ? (
              <div className="empty">
                No trades yet. Start the Spot Bot from the CONTROL tab to begin paper trading.
              </div>
            ) : (
              <div className="trades-list">
                {trades.map(t => <TradeCard key={t.id} t={t}/>)}
              </div>
            )}
          </div>
        )}

        {/* LOGS */}
        {tab==='logs' && (
          <div className="card">
            <div className="card-title">🗒️ Bot Logs</div>
            {logs.length===0 ? (
              <div className="empty">No logs yet.</div>
            ) : (
              <div className="log-list">
                {logs.map(l => (
                  <div key={l.id} className={`log-row ${l.level}`}>
                    <span className="log-time">{(l.created_at||'').slice(11,19)}</span>
                    <span>{l.message}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {/* SETTINGS */}
        {tab==='settings' && (
          <>
            <div className="card">
              <div className="card-title">💰 Capital</div>
              <div className="settings-grid">
                <div className="input-wrap">
                  <label className="input-label">Capital (USDT)</label>
                  <input className="input-field" type="number" step="0.01"
                    value={capital}
                    onChange={e=>setCapital(e.target.value)}
                    placeholder="7.69"/>
                </div>
                <div className="input-wrap">
                  <label className="input-label">≈ KES</label>
                  <input className="input-field" readOnly
                    value={(parseFloat(capital)*130||0).toFixed(0)}/>
                </div>
              </div>
              <button className="btn btn-primary" style={{marginTop:14}} onClick={saveCapital}>
                {saved ? '✅ Saved!' : '💾 Save Capital'}
              </button>
              <div style={{fontSize:11,color:'var(--muted)',marginTop:8}}>
                Capital is saved locally on this device and sent to the risk manager.
              </div>
            </div>

            <div className="card">
              <div className="card-title">🔗 System Status</div>
              {[
                ['Backend',       `cryptoos.onrender.com`,     backendStatus==='online'],
                ['WebSocket',     'Live price feed',            wsStatus==='live'],
                ['Paper Mode',    'Simulation active',          botState.paper_mode!==false],
                ['Binance API',   'Keys connected',             true],
                ['Safe to Trade', 'Within risk limits',         risk.safe_to_trade!==false],
              ].map(([label,desc,ok])=>(
                <div key={label} className="price-item" style={{marginBottom:6}}>
                  <div>
                    <div style={{fontSize:12,fontWeight:700}}>{label}</div>
                    <div style={{fontSize:10,color:'var(--muted)'}}>{desc}</div>
                  </div>
                  <span style={{fontSize:12,fontWeight:700,color:ok?'#10b981':'#ef4444'}}>
                    {ok?'● ACTIVE':'● OFFLINE'}
                  </span>
                </div>
              ))}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
